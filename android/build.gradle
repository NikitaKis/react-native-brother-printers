apply plugin: 'com.android.library'

group = 'expo.modules.brotherprinters'
version = '0.3.28'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

def resolveBrotherAarPath() {
  if (project.hasProperty("brotherPrintLibraryAarPath")) {
    return project.property("brotherPrintLibraryAarPath")
  }

  if (rootProject.ext.has("brotherPrintLibraryAarPath")) {
    return rootProject.ext.get("brotherPrintLibraryAarPath")
  }

  def envPath = System.getenv("BROTHER_PRINT_LIBRARY_AAR")
  if (envPath != null && !envPath.trim().isEmpty()) {
    return envPath
  }

  return "libs/BrotherPrintLibrary.aar"
}

def brotherAarPath = resolveBrotherAarPath()
def brotherAarFile = file(brotherAarPath)
if (!brotherAarFile.exists()) {
  throw new GradleException("Brother SDK AAR not found at: ${brotherAarFile}. Set brotherPrintLibraryAarPath or BROTHER_PRINT_LIBRARY_AAR.")
}

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 35)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 21)
      targetSdkVersion safeExtGet("targetSdkVersion", 35)
    }
  }
}
dependencies {
  implementation files(brotherAarFile)
}

android {
  namespace "expo.modules.brotherprinters"
  defaultConfig {
    versionCode 2
    versionName "0.3.28"
  }
  lintOptions {
    abortOnError false
  }
}
